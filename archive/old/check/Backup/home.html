<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home – Bike Safety</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="form-base.css">
  <link rel="stylesheet" href="forgot_Password.css">
</head>
<body>
  <div class="container py-5">
  <h1>Welcome to Bike Safety</h1>
  <p>This is the home page. Replace with your actual content.</p>
  </div>
</body>
</html>
  <!-- Bootstrap JS (optional but recommended for form validation) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  // Show/hide sections based on form progress
  document.getElementById('sendCodeBtn').addEventListener('click', function() {
  const email = document.getElementById('email').value;
  if (email) {
  document.getElementById('codeSection').classList.remove('hidden');
  document.getElementById('codeSection').classList.add('visible');
  } else {
  alert('Please enter an email address');
  }
  });

  document.getElementById('resetCodeBtn').addEventListener('click', function() {
  const code = document.getElementById('code').value;
  if (code) {
  document.getElementById('passwordSection').classList.remove('hidden');
  document.getElementById('passwordSection').classList.add('visible');
  } else {
  alert('Please enter the code');
  }
  });

  document.getElementById('updatePasswordBtn').addEventListener('click', function() {
  const password = document.getElementById('password').value;
  const confirmPassword = document.querySelectorAll('#password')[1].value;
  
  if (!password || !confirmPassword) {
  alert('Please fill in both password fields');
  return;
  }
  
  if (password !== confirmPassword) {
  alert('Passwords do not match');
  return;
  }
  
  alert('Password updated successfully!');
  });
  </script>
</body>
</html>
