<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Stolen Bikes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
  integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container py-5"> <!add container-->
    <div class="row d-flex justify-content-center align-items-center"> <!center the box in the midle-->
      <div class="col-12 col-lg-7"> <!the size of the box in the midle-->
        <div class="card bg-light text-dark" style="border-radius: 3rem;"> <!add the box with test collour-->
          <div class="card-body p-5 text-center"> <!test centered-->
            <h1 class="mb-3">Login</h1>
            <p class="text-50 mb-5">
              Please enter your account details to sighn into your account.
            </p> <!test size with gap bellow-->
            <form>
              <div data-mdb-input-init class="form-outline form-floating form-dark mb-4">
                <input type="text" id="username" name="username" placeholder=""
                  class="form-control form-control-lg" required />
                <label class="form-label" for="surname">Username*</label>
              </div>

              <div data-mdb-input-init class="form-outline form-floating form-dark mb-2">
                <input type="text" id="password" name="password" placeholder=""
                  class="form-control form-control-lg" required />
                <label class="form-label" for="password">Password*</label>
              </div>

              <button data-mdb-button-init data-mdb-ripple-init class="btn btn-primary mt-2 mb-3 btn-lg px-5"
                type="submit">Login</button>

              <p class="small pb-lg-3"><a class="text-dark" href="forgot_password.html">Forgot Password</a></p>
              <p class="small pb-lg-3"><a class="text-dark" href="register.html">Create Account</a></p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>  
</body>

</html>
