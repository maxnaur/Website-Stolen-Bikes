<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password – Bike Safety</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- ressize and colours CSS -->
  <link rel="stylesheet" href="../common/style/form-base.css">
  <!-- hide sections and display them -->
  <link rel="stylesheet" href="forgot_password.css">
</head>
<body>
  <div class="container py-1">
  <div class="row justify-content-center">
  <div class="col-md-10">
  <div class="card shadow-sm">
    <div class="card-body">
    <h1 class="text-center mb-4">Forgot Password</h1>
    <h2 class="text-center mb-4">Enter your email, then enter the code that was received to reset your password.</h2>
    <!-- Email Section -->
    <div class="email section visible" id="emailSection">
    <div class="row g-3">
    <div class="col-md-12">
      <label for="email" class="form-label">Email*</label>
      <input type="email" class="form-control" id="email" placeholder="Email" required>
      <div class="email-error text-danger small mt-1" style="display:none;"></div>
    </div>
    </div>
    
    <div class="mt-4 text-center">
    <button type="submit" class="btn btn-primary btn-lg px-5" id="sendCodeBtn">Send Code</button>
    </div>
    </div>
    
    <!-- Code Section -->
    <div class="code section hidden" id="codeSection">
    <div class="row g-3">
    <div class="col-md-12">
      <label for="code" class="form-label">Received Code*</label>
      <input type="text" class="form-control" id="code" placeholder="Code" required>
    </div>
    </div>
    
    <div class="mt-4 text-center">
    <button type="button" class="btn btn-primary btn-lg px-5" id="resetCodeBtn">Reset Password</button>
    </div>
    </div>

    <!-- New Password Section -->
    <div class="password section hidden" id="passwordSection">
    <div class="row g-3">
    <div class="col-md-12">
      <label for="password" class="form-label">Password*</label>
      <input type="password" class="form-control" id="password" placeholder="Password" required>
      <label class="form-check-label">
      <input type="checkbox" class="toggle-password form-check-input" data-target="#password">
      Show password
      </label>
    </div>
    <div class="col-md-12">
      <label for="confirmPassword" class="form-label">Confirm Password*</label>
      <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password" required>
      <label class="form-check-label">
      <input type="checkbox" class="toggle-password form-check-input" data-target="#confirmPassword">
      Show password
      </label>
    </div>
    </div>
    
    <div class="mt-4 text-center">
    <button type="button" class="btn btn-primary btn-lg px-5" id="updatePasswordBtn">Update Password</button>
    </div>
    </div>
    
    <div class="mt-3 text-center">
    <a href="index.html" class="text-decoration-none text-muted">Sign In</a>
    </div>
    </div>
  </div>
  </div>
  </div>
  </div>

  <!-- Bootstrap JS (optional but recommended for form validation) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  // Show/hide sections based on form progress
  document.getElementById('sendCodeBtn').addEventListener('click', function() {
  const email = document.getElementById('email').value;
  if (email) {
  document.getElementById('codeSection').classList.remove('hidden');
  document.getElementById('codeSection').classList.add('visible');
  } else {
  alert('Please enter an email address');
  }
  });

  document.getElementById('resetCodeBtn').addEventListener('click', function() {
  const code = document.getElementById('code').value;
  if (code) {
  document.getElementById('passwordSection').classList.remove('hidden');
  document.getElementById('passwordSection').classList.add('visible');
  } else {
  alert('Please enter the code');
  }
  });

  document.getElementById('updatePasswordBtn').addEventListener('click', function() {
  const password = document.getElementById('password').value;
  const confirmPassword = document.querySelectorAll('#password')[1].value;
  
  if (!password || !confirmPassword) {
  alert('Please fill in both password fields');
  return;
  }
  
  if (password !== confirmPassword) {
  alert('Passwords do not match');
  return;
  }
  
  alert('Password updated successfully!');
  });
  </script>
  <!-- shared utilities -->
  <script src="../style/form-utils.js"></script>
</body>
</html>
