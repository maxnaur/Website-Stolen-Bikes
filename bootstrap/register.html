<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register - Gloucestershire Bike Registry</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="register.css" />
</head>

<body>
  <div class="container py-5 h-100">

    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-12 col-md-8 col-lg-6 col-s-5">

        <div class="card bg-light text-dark" style="border-radius: 1rem;">
          <div class="card-body p-5 text-center">

            <div class="mb-md-5 mt-md-4 pb-5">
              <h1>Register</h1>
              <p class="text-50 mb-5">
                Please fill in the form below to create a new account for Gloucestershire Bike Registry.
              </p>
              <form>
                <div data-mdb-input-init class="form-outline form-floating form-dark mb-5">
                  <input type="text" id="username" name="username" placeholder="Username"
                    class="form-control form-control-lg" required />
                  <label class="form-label" for="username">Username</label>
                </div>
                <div data-mdb-input-init class="form-outline form-floating form-dark mb-2">
                  <input type="text" id="forename" name="forename" placeholder="Forename"
                    class="form-control form-control-lg" required />
                  <label class="form-label" for="forename">Forename</label>
                </div>
                <div data-mdb-input-init class="form-outline form-floating form-dark mb-5">
                  <input type="text" id="surname" name="surname" placeholder="Surname"
                    class="form-control form-control-lg" required />
                  <label class="form-label" for="surname">Surname</label>
                </div>
                <div data-mdb-input-init class="form-outline form-floating form-dark mb-2">
                  <input type="text" id="email" name="email" placeholder="Email" class="form-control form-control-lg"
                    required />
                  <label class="form-label" for="email">Email</label>
                </div>
                <div data-mdb-input-init class="form-outline form-floating form-dark mb-2">
                  <input type="text" id="confirm_email" name="confirm_email" placeholder="Confirm Email"
                    class="form-control form-control-lg" required />
                  <label class="form-label" for="confirm_email">Confirm Email</label>
                </div>
                <div data-mdb-input-init class="form-outline form-floating form-dark mb-5">
                  <input type="tel" id="phone" name="phone" placeholder="Phone" class="form-control form-control-lg"
                    required />
                  <label class="form-label" for="phone">Phone</label>
                </div>
                <div data-mdb-input-init class="form-outline form-floating form-dark mb-2">
                  <input type="text" id="address_line_1" name="address_line_1" placeholder="Address Line 1"
                    class="form-control form-control-lg" required />
                  <label class="form-label" for="address_line_1">Address Line 1</label>
                </div>
                <div data-mdb-input-init class="form-outline form-floating form-dark mb-2">
                  <input type="text" id="address_line_2" name="address_line_2" placeholder="Address Line 2"
                    class="form-control form-control-lg" />
                  <label class="form-label" for="address_line_2">Address Line 2</label>
                </div>
                <div data-mdb-input-init class="form-outline form-floating form-dark mb-2">
                  <input type="text" id="postcode" name="postcode" placeholder="Postcode"
                    class="form-control form-control-lg" required />
                  <label class="form-label" for="postcode">Postcode</label>
                </div>
                <div data-mdb-input-init class="form-outline form-floating form-dark mb-2">
                  <input type="text" id="county" name="county" placeholder="County" class="form-control form-control-lg"
                    required />
                  <label class="form-label" for="county">County</label>
                </div>
                <div data-mdb-input-init class="form-outline form-floating form-dark mb-5">
                  <input type="text" id="town_city" name="town_city" placeholder="City"
                    class="form-control form-control-lg" required />
                  <label class="form-label" for="town_city">City</label>
                </div>
                <div data-mdb-input-init class="form-outline form-floating form-dark mb-2">
                  <input type="text" id="password" name="password" placeholder="Password"
                    class="form-control form-control-lg" required />
                  <label class="form-label" for="password">Password</label>
                </div>
                <div data-mdb-input-init class="form-outline form-floating form-dark mb-5">
                  <input type="text" id="confirm_password" name="confirm_password" placeholder="Confirm Password"
                    class="form-control form-control-lg" required />
                  <label class="form-label" for="confirm_password">Confirm Password</label>
                </div>

                <button data-mdb-button-init data-mdb-ripple-init class="btn btn-primary mt-2 mb-3 btn-lg px-5"
                  type="submit">Register</button>

                <p class="small pb-lg-2"><a class="text-dark" href="index.html">Back to Login</a></p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
