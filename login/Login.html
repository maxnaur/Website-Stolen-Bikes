  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../common/style/form-base.css">
  <link rel="stylesheet" href="../common/sidebar/sidebar.css">
</head>
<body>
  <!-- Sidebar Navigation -->
  <div>
  <ul id="top bar">
  <li><a href="../home/Home.html">Home</a></li>

  <script>
  // show error from query string if present
  const params = new URLSearchParams(window.location.search);
  if (params.has('error')) {
  alert(params.get('error'));
  }
  </script>
  <div class="container py-1">
  <div class="row justify-content-center">
  <div class="col-md-10">
  <div class="card shadow-sm">
    <div class="card-body">
    <h1 class="text-center mb-4">Log In</h1>
    <!-- login form posts to backend script -->
    <form id="loginForm" method="POST" action="login.php">
    <div class="row g-3">
    <!-- Email -->
    <div class="col-md-12">
      <label for="email" class="form-label">Email*</label>
      <input type="email" name="email" class="form-control" id="email" placeholder="Email" required>
      <div id="error-message" class="text-danger small mt-1" style="display:none;"></div>
    </div>
    
    <!-- Password -->
    <div class="col-md-12">
      <label for="password" class="form-label">Password*</label>
      <input type="password" name="password" class="form-control" id="password" placeholder="Password" required>
    </div>

    <!-- Show password checkbox -->
    <div class="col-md-10 form-check mt-2">
      <input class="form-check-input" type="checkbox" value="" id="showPasswordCheck">
      <label class="form-check-label" for="showPasswordCheck">
      Show password
      </label>
    </div>
    </div>

    <div class="mt-4 text-center">
    <button type="submit" class="btn btn-primary btn-lg px-5">Log In</button>
    </div>
    
    <div class="mt-6 text-center py-1">
    <a href="../register/register.html" class="text-decoration-none text-muted">Create Account</a>
    </div>
    <div class="mt-6 text-center">
    <a href="../forgot_password/Forgot_Password.html" class="text-decoration-none text-muted">Forgot Password</a>
    </div>
    </form>
    </div>
  </div>
  </div>
  </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
