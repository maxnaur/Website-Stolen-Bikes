<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to the Bike Police Report System">
  <meta name="theme-color" content="#2f4ccd">
  <title>Login - Bike's Safety</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../common/form-base.css">
  <link rel="stylesheet" href="../common/sidebar.css">
</head>
<body>
  <!-- Sidebar Navigation -->
  <nav aria-label="Main navigation">
  <ul id="topbar">
    <li><a href="../">Home</a></li>
    <li><a href="../home/meet-the-team.html">Meet The Team</a></li>
    <li><a href="./login.html" aria-current="page">Login</a></li>
    <li><a href="../register/register.html">Register</a></li>
  </ul>
  </nav>

  <div class="container py-1">
  <div class="row justify-content-center">
  <div class="col-md-10">
  <div class="card shadow-sm">
    <div class="card-body">
    <h1 class="text-center mb-4">Log In</h1>

    <!-- Display error from URL if present -->
    <div id="url-error" class="alert alert-danger text-center mb-4" style="display:none;" role="alert"></div>

    <!-- login form posts to backend script -->
    <form id="loginForm" method="POST" action="../api/auth.php?action=login" novalidate>
    <!-- CSRF Token -->
    <input type="hidden" name="csrf_token" id="csrfToken" value="">
    <div class="row g-3">
    <!-- Email -->
    <div class="col-md-12">
      <label for="email" class="form-label">Email <span aria-label="required">*</span></label>
      <input type="email" name="email" class="form-control" id="email" placeholder="user@example.com" required aria-required="true" autocomplete="email" maxlength="100">
      <div id="error-message" class="text-danger small mt-1" style="display:none;"></div>
    </div>
    
    <!-- Password -->
    <div class="col-md-12">
      <label for="password" class="form-label">Password <span aria-label="required">*</span></label>
      <input type="password" name="password" class="form-control" id="password" placeholder="Enter your password" required aria-required="true" autocomplete="current-password" maxlength="100">
    </div>

    <!-- Show password checkbox -->
    <div class="col-md-10 form-check mt-2">
      <input class="form-check-input toggle-password" type="checkbox" value="" id="showPasswordCheck" data-target="#password" aria-label="Show password">
      <label class="form-check-label" for="showPasswordCheck">
      Show password
      </label>
    </div>
    </div>

    <div class="mt-4 text-center">
    <button type="submit" class="btn btn-primary btn-lg px-5">Log In</button>
    </div>
    </form>
    </div>
  </div>
  </div>
  </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="login.js"></script>
</body>
</html>
